model:
  provider: hyperbolic        # hyperbolic (cloud, no local compute; messages go to an external service) | local (llama-server + GGUF)
  hyperbolic:
    display_name: Hyperbolic
    base_url: https://api.hyperbolic.xyz/v1
    model: meta-llama/Llama-3.3-70B-Instruct                          # sent verbatim in the request body
    fallback_models: [meta-llama/Llama-3.1-70B-Instruct]               # tried only if the primary is unavailable (404/400) or stays busy
    key_env: HYPERBOLIC_API_KEY   # the key itself lives in .env (git-ignored) or the environment, never in this file
    system_prefix: >-
      You are a human taking part in a conversation training simulation. You must strictly mimic a realistic human: never mention
      being an AI, never offer assistance, never use corporate transitions or assistant phrasing, and never refuse a conversational
      turn. Adopt a natural, flawed human persona completely. (The hard limits listed below still apply: handle them by deflecting
      in character, never by lecturing.)
    min_interval_s: 0.3
    max_retries: 3
    timeout_s: 120
  candidate: huihui-qwen3-8b-abliterated-v2   # provisional; decided only after bake-off (DECISIONS D-004)
  quant: Q4_K_M
  gguf_repo: mradermacher/Huihui-Qwen3-8B-abliterated-v2-GGUF   # UNVERIFIED name (no HF access when written). If it fails: python scripts/download_model.py --search "Huihui Qwen3 8B abliterated GGUF"
  gguf_file: null          # auto-picked from the quant above
  chat_template_no_think: true
llama_server: {host: 127.0.0.1, port: 8081, ctx: 8192, binary: llama-server, gpu_layers: 99, extra_args: []}
sampling: {temperature: 0.85, top_p: 0.92, top_k: 60, min_p: 0.05, repeat_penalty: 1.1, presence_penalty: 0.5, frequency_penalty: 0.2, max_tokens: 100}
# NOTE (D-009): safety constants (min age 19, ceiling, 45-min cap, STOP triggers, allow_onset)
# live in backend/constants.py. Config may only TIGHTEN them (e.g. min(cfg,45)); it can never loosen.
limits:
  min_free_ram_gb: 6                 # (the 45-minute cap lives in study.max_session_minutes; config can only tighten it)
safeguards:
  distress_mode: pause   # pause = support card with a choice to continue (default while only examiners test); end = stricter, ends the chat. Config may only tighten.
  min_persona_age: 19
  allow_onset: true      # stage 6 (non-explicit onset). Config can only turn it OFF; the ceiling filter is always on
  max_filter_regenerations: 3
  antirepeat_max_retries: 2
stop_text_triggers: ["STOP", "STOPP", "ABBRUCH"]   # whole-message, case-insensitive only
network: {allow_outbound: false}
study:
  title: "Training system that protects against manipulation"
  researcher_name: "Isha Nikam"
  researcher_contact: "isha.nikam@student.hnu.de"
  supervisor_contact: "marten.risius@hnu.de"
  data_deletion_note: "Email the contact above with your participant ID to have your data deleted."
  max_session_minutes: 45            # per persona conversation, enforced server-side; config can only tighten (hard cap 45)
  consent_version: v1
  wellbeing_note: "If anything in this conversation left you unsettled, please talk to the researcher present or use a support line below."
